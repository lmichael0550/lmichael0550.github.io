<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mreow?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Big Animated Cat -->
  <div class="cat boba">
    <div class="ear left-ear"></div>
    <div class="ear right-ear"></div>
    <div class="face">
      <div class="eye left-eye"><div class="eyeball"></div></div>
      <div class="eye right-eye"><div class="eyeball"></div></div>
    </div>
    
    <!--<div class="mouth"></div>-->
    <div class="tail"></div>
  </div>

  <!-- Small Animated Cat -->
  <div class="cat sago">
    <div class="ear left-ear"></div>
    <div class="ear right-ear"></div>
    <div class="face">
      <div class="eye left-eye"><div class="eyeball"></div></div>
      <div class="eye right-eye"><div class="eyeball"></div></div>
    </div>
    <!--<div class="mouth"></div>-->
    <div class="tail"></div>
  </div>

  <div class="container">
    <h1>Identity check </h1>
    <p>🐾 Paws right there, we need to do a security check 🐾</p>
    <h2>Cats or Dogs </h2>
    <div class="buttons">
      <button id="yesButton">Cats</button>
      <button id="noButton">Dogs</button>
    </div>
    <p id="response"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
